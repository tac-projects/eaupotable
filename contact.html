<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contactez l'Observatoire | EauPotable.net</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- CSS Architecture -->
    <link rel="stylesheet" href="variables.css">
    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="layout.css">
    <link rel="stylesheet" href="components.css">
    <link rel="stylesheet" href="responsive.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    

</head>
<body class="bg-surface">

    <header class="transparent-header">
        <div class="container nav-wrapper">
            <a href="/" class="logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="logo-icon">
                    <path d="M12 21.5C16.1421 21.5 19.5 18.1421 19.5 14C19.5 9.85786 12 2.5 12 2.5C12 2.5 4.5 9.85786 4.5 14C4.5 18.1421 7.85786 21.5 12 21.5Z" fill="url(#dropGradientMenu)" />
                    <defs>
                        <linearGradient id="dropGradientMenu" x1="12" y1="2.5" x2="12" y2="21.5" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#0066FF" />
                            <stop offset="1" stop-color="#00A3FF" />
                        </linearGradient>
                    </defs>
                </svg>
                EauPotable.net
            </a>
            <button id="hamburger" class="hamburger-btn" aria-label="Menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </header>

    <div id="main-menu" class="main-menu">
        <button class="close-menu" aria-label="Fermer le menu">&times;</button>
        <div class="logo-menu">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="logo-menu-icon">
                <path d="M12 21.5C16.1421 21.5 19.5 18.1421 19.5 14C19.5 9.85786 12 2.5 12 2.5C12 2.5 4.5 9.85786 4.5 14C4.5 18.1421 7.85786 21.5 12 21.5Z" fill="var(--primary-solid)" />
            </svg>
            EauPotable.net
        </div>
        <ul class="menu-items">
            <li><a href="/">Carte Interactive</a></li>
            <li><a href="mentions-legales.html">Mentions Légales</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
        <div class="menu-footer">
            <p>&copy; 2026 EauPotable.net - Observatoire Indépendant</p>
        </div>
    </div>

    <main class="content-wrapper">
        <h1>Contactez-nous</h1>
        <p class="text-subtle">Une question sur vos relevés ? Un retour sur l'observatoire ? Notre équipe citoyenne vous répond sous 48h.</p>
        
        <form class="form-card">
            <div class="form-group">
                <label>Votre Nom</label>
                <input type="text" placeholder="Ex: Jean Dupont" required>
            </div>
            <div class="form-group">
                <label>Email de réponse</label>
                <input type="email" placeholder="contact@votre-domaine.com" required>
            </div>
            <div class="form-group">
                <label>Votre message</label>
                <textarea rows="6" placeholder="Comment pouvons-nous vous aider ?" required></textarea>
            </div>
            <button type="submit" class="submit-btn" onclick="event.preventDefault(); alert('Merci ! Votre message a été simulé avec succès.')">Envoyer ma demande</button>
        </form>
    </main>

    <script>
        const hamburger = document.getElementById('hamburger');
        const mainMenu = document.getElementById('main-menu');
        const closeMenu = document.querySelector('.close-menu');

        hamburger.onclick = () => mainMenu.classList.add('active');
        closeMenu.onclick = () => mainMenu.classList.remove('active');
    </script>
</body>
</html>
