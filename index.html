<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EauPotable.net | L'Observatoire Indépendant de la Qualité de l'Eau</title>
    <meta name="description" content="Vérifiez la qualité de l'eau potable de votre commune en temps réel. Accédez aux rapports officiels sur les pesticides, nitrates et calcaire.">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Mapbox GL JS -->
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.1.2/mapbox-gl.css" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.1.2/mapbox-gl.js"></script>
    
    <!-- CSS Architecture -->
    <link rel="stylesheet" href="variables.css">
    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="layout.css">
    <link rel="stylesheet" href="components.css">
    <link rel="stylesheet" href="responsive.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body style="overflow: hidden;">

    <header class="transparent-header">
        <div class="container nav-wrapper">
            <a href="/" class="logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="margin-right: 8px;">
                    <path d="M12 21.5C16.1421 21.5 19.5 18.1421 19.5 14C19.5 9.85786 12 2.5 12 2.5C12 2.5 4.5 9.85786 4.5 14C4.5 18.1421 7.85786 21.5 12 21.5Z" fill="url(#dropGradient)" />
                    <path d="M12 21.5C10.5 21.5 8.5 20.5 7.5 18.5" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.4" />
                    <defs>
                        <linearGradient id="dropGradient" x1="12" y1="2.5" x2="12" y2="21.5" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#0066FF" />
                            <stop offset="1" stop-color="#00A3FF" />
                        </linearGradient>
                    </defs>
                </svg>
                EauPotable.net
            </a>
            <button id="hamburger" class="hamburger-btn" aria-label="Menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </header>

    <!-- Menu Hamburger Correctement Structuré -->
    <div id="main-menu" class="main-menu">
        <button class="close-menu" aria-label="Fermer le menu">&times;</button>
        
        <div class="logo-menu">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="margin-right: 12px;">
                <path d="M12 21.5C16.1421 21.5 19.5 18.1421 19.5 14C19.5 9.85786 12 2.5 12 2.5C12 2.5 4.5 9.85786 4.5 14C4.5 18.1421 7.85786 21.5 12 21.5Z" fill="var(--primary-solid)" />
            </svg>
            EauPotable.net
        </div>

        <ul class="menu-items">
            <li><a href="/">Carte Interactive</a></li>
            <li><a href="mentions-legales.html">Mentions Légales</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>

        <div class="menu-footer">
            <p>&copy; 2026 EauPotable.net - Observatoire Indépendant</p>
        </div>
    </div>

    <main>
        <section id="map-section">
            <div id="map"></div>
            
            <!-- Barre de recherche ergonomique (Thumb Zone) -->
            <div class="search-floating bottom-search">
                <div class="search-box">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="search-icon"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <input type="text" id="searchVille" placeholder="Entrez votre ville ou code postal..." class="search-input">
                    <button id="geolocate-btn" class="geolocate-btn" aria-label="Se localiser">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                            <circle cx="12" cy="10" r="3"></circle>
                        </svg>
                    </button>
                </div>
                <div class="search-results" id="search-results"></div>
            </div>

            <div id="side-panel" class="side-panel">
                <button class="close-panel" aria-label="Fermer le panneau">&times;</button>
                <div id="panel-content">
                    <p style="text-align: center; margin-top: 50%; color: var(--text-light);">Recherchez votre ville pour l'analyse officielle</p>
                </div>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
