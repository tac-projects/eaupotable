services:
  site:
    image: eaupotable:latest
    container_name: eaupotable
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
