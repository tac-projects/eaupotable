# eaupotable.net — Reverse proxy vers Next.js (localhost:3000)
# Cloudflare gère le SSL, le cf-ray et HTTP/3. Le VPS reçoit du HTTP.

server {
    listen 80;
    listen [::]:80;

    server_name www.eaupotable.net eaupotable.net;

    access_log /var/log/nginx/eaupotable-access.log;
    error_log  /var/log/nginx/eaupotable-error.log;

    # Limite de taille des requêtes (protection anti-saturation)
    client_max_body_size 1m;

    # ------------------------------------------------------------------
    # Next.js (serveur local)
    # ------------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:3000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Cloudflare → VPS est en HTTP, mais le visiteur est en HTTPS
        proxy_set_header X-Forwarded-Proto https;

        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;

        proxy_buffering off;
    }

    # Redirection eaupotable.net → www.eaupotable.net
    if ($host = "eaupotable.net") {
        return 301 https://www.eaupotable.net$request_uri;
    }

    # Bloque l'accès aux fichiers cachés
    location ~ /\. {
        deny all;
    }
}
